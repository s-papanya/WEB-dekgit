version: '3'
services:
  demo_mysql:
    container_name: demo-mysql
    image: mysql/mysql-server
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: demo
      MYSQL_ROOT_PASSWORD: dekgit1191
      MYSQL_ROOT_HOST: '%'
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./data:/var/lib/mysql
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    restart: always
    networks:
      - demo

  app:
    build:
      context: ./server-ts
    container_name: demo-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: mysql
      DATABASE_HOST: demo_mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: demo
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: dekgit1191
      APP_KEYS: z6AfcJhCPT3q3eEoUCWnJ2QHg9X5dRk8
      JWT_SECRET: x5ZDKL3F8NzYH2Q9bPuXcRgA7jVWtMeh
      ADMIN_JWT_SECRET: d9YU6rBzXyJ7vE2QcZmGwT4LhNpSfHxK
      API_TOKEN_SALT: sT6uPvM8W4wKxZcJ7jRzLgY9E3fHnDqA
    volumes:
      - ./app:/srv/app
    ports:
      - 127.0.0.1:8000:1337
    depends_on:
      - demo_mysql
    networks:
      - demo
networks:
  demo: